packages:
  - apps/*
  - packages/*

enablePrePostScripts: true
autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  '@playwright/browser-chromium': false
  canvas: true
  cpu-features: false
  electron-winstaller: true
  esbuild: true
  protobufjs: false
  ssh2: false
  unix-dgram: false

peerDependencyRules:
  allowedVersions:
    vite-plugin-pwa>vite: '8'
